[project]
name = "econformal"
version = "0.4.0"
description = "计量经济学模型共形推断工具包 | Conformal Inference Toolkit for Econometric Models"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Forry Wu"}
]
maintainers = [
    {name = "Forry Wu"}
]
keywords = [
    "econometrics",
    "conformal inference",
    "causal inference",
    "DID",
    "synthetic control",
    "panel data",
    "statistics",
    "machine learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "statsmodels",
    "linearmodels",
    "scikit-learn",
    "cvxpy",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/mingzidouzhemenanqi/econformal"
Documentation = "https://github.com/mingzidouzhemenanqi/econformal#readme"
Repository = "https://github.com/mingzidouzhemenanqi/econformal.git"
Issues = "https://github.com/mingzidouzhemenanqi/econformal/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/econformal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "twine>=6.1.0",
]
